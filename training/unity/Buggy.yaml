behaviors:
  Buggy:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
      beta_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 50000
    max_steps: 10000000
    time_horizon: 300
    summary_freq: 10000

environment_parameters:
  num_targets:
    curriculum:
      - name: Lesson0_OneTarget
        completion_criteria:
          measure: reward
          behavior: Buggy
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 3.0
        value: 1.0
      - name: Lesson1_TwoTargets
        completion_criteria:
          measure: reward
          behavior: Buggy
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 5.0
        value: 2.0
      - name: Lesson2_AllTargets
        value: 4.0